<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VÉLORA Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5;color:#111}.top{background:#111;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1150px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e8e8e8;border-radius:15px;padding:18px;margin-bottom:18px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tabs button{border:0;padding:11px 15px;border-radius:9px;background:#e9e9e9;cursor:pointer}.tabs button.active{background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.product{border:1px solid #eee;border-radius:12px;overflow:hidden}.product img{width:100%;height:220px;object-fit:cover}.product .p{padding:12px}input,textarea,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;margin:6px 0 12px}button.primary{background:#111;color:#fff;border:0;padding:11px 15px;border-radius:9px;cursor:pointer}.danger{background:#b42318!important;color:#fff;border:0;padding:9px;border-radius:8px;cursor:pointer}.hidden{display:none}.order{border:1px solid #eee;border-radius:12px;padding:14px;margin:10px 0}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.stat{font-size:28px;font-weight:800}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.row{flex-direction:column;align-items:stretch}}@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="top"><b>VÉLORA ADMIN</b><button class="primary" onclick="location.href='index.html'">View Store</button></div>
<div class="wrap">
<div id="login" class="card"><h2>Admin Login</h2><p>Use your Supabase Auth admin account.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="primary" onclick="login()">Login</button><p id="msg"></p></div>
<div id="app" class="hidden">
<div class="tabs"><button class="active" onclick="tab('dashboard',this)">Dashboard</button><button onclick="tab('productsTab',this)">Products</button><button onclick="tab('ordersTab',this)">Orders</button><button onclick="tab('settingsTab',this)">Website Settings</button><button onclick="logout()">Logout</button></div>
<section id="dashboard" class="card"><h2>Dashboard</h2><div class="grid"><div class="card"><div class="stat" id="pc">0</div>Products</div><div class="card"><div class="stat" id="oc">0</div>Orders</div><div class="card"><div class="stat" id="sales">₹0</div>Sales</div></div></section>
<section id="productsTab" class="card hidden"><h2>Products</h2><button class="primary" onclick="showForm()">+ Add Product</button><div id="form" class="card hidden"><input id="pid" type="hidden"><input id="pname" placeholder="Product name"><input id="pcat" placeholder="Category"><input id="pprice" type="number" placeholder="Price"><input id="pdiscount" type="number" placeholder="Discount %"><input id="pimage" placeholder="Image URL (or use Supabase Storage in production)"><input id="pstock" type="number" placeholder="Stock"><input id="psizes" placeholder="Sizes e.g. S,M,L,XL"><input id="pcolors" placeholder="Colors e.g. Black,White"><button class="primary" onclick="saveProduct()">Save Product</button></div><div id="plist" class="grid"></div></section>
<section id="ordersTab" class="card hidden"><h2>Orders</h2><div id="olist"></div></section>
<section id="settingsTab" class="card hidden"><h2>Website Settings</h2><input id="slogo" placeholder="Logo text"><input id="stitle" placeholder="Hero title"><textarea id="stext" placeholder="Hero description"></textarea><input id="sannouncement" placeholder="Announcement bar"><input id="saccent" placeholder="Accent color e.g. #111111"><button class="primary" onclick="saveSettings()">Save settings</button></section>
</div></div>
<script>
const SUPABASE_URL="https://ggvanfhwascvoptxmzle.supabase.co",SUPABASE_ANON_KEY="sb_publishable_O3QmC27XiGOGuePSEaZD1A_x5BdIkqb";let sb=null;
async function init(){if(!SUPABASE_URL.startsWith("YOUR_")){sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let {data}=await sb.auth.getSession();if(data.session)enter()}else{msg.textContent="Add Supabase URL and anon key in this file first."}}
async function login(){if(!sb)return alert("Configure Supabase first.");let r=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(r.error)msg.textContent=r.error.message;else enter()}
function enter(){login.classList?.add?.("hidden");document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");loadAll()}
async function logout(){if(sb)await sb.auth.signOut();location.reload()}
function tab(id,b){document.querySelectorAll("#app>section").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active")}
async function loadAll(){await loadProducts();await loadOrders();await loadSettings()}
async function loadProducts(){let {data,error}=await sb.from("products").select("*").order("created_at",{ascending:false});if(error)return;pc.textContent=data.length;plist.innerHTML=data.map(p=>`<div class="product"><img src="${p.image||''}"><div class="p"><b>${p.name}</b><p>₹${p.price} • Stock ${p.stock||0}</p><button class="primary" onclick='editProduct(${JSON.stringify(p)})'>Edit</button> <button class="danger" onclick="delProduct('${p.id}')">Delete</button></div></div>`).join("")}
function showForm(){form.classList.remove("hidden");pid.value="";pname.value="";pcat.value="";pprice.value="";pdiscount.value="";pimage.value="";pstock.value="";psizes.value="";pcolors.value=""}
function editProduct(p){showForm();pid.value=p.id;pname.value=p.name;pcat.value=p.category||"";pprice.value=p.price;pdiscount.value=p.discount||0;pimage.value=p.image||"";pstock.value=p.stock||0;psizes.value=(p.sizes||[]).join(",");pcolors.value=(p.colors||[]).join(",")}
async function saveProduct(){let obj={name:pname.value,category:pcat.value,price:+pprice.value,discount:+pdiscount.value||0,image:pimage.value,stock:+pstock.value||0,sizes:psizes.value.split(",").map(x=>x.trim()).filter(Boolean),colors:pcolors.value.split(",").map(x=>x.trim()).filter(Boolean),active:true};let r=pid.value?await sb.from("products").update(obj).eq("id",pid.value):await sb.from("products").insert(obj);if(r.error)alert(r.error.message);else{form.classList.add("hidden");loadProducts()}}
async function delProduct(id){if(confirm("Delete this product?")){let r=await sb.from("products").delete().eq("id",id);if(r.error)alert(r.error.message);else loadProducts()}}
async function loadOrders(){let {data,error}=await sb.from("orders").select("*").order("created_at",{ascending:false});if(error)return;oc.textContent=data.length;sales.textContent="₹"+data.reduce((a,x)=>a+(+x.total||0),0);olist.innerHTML=data.map(o=>`<div class="order"><div class="row"><b>${o.order_code}</b><span>${o.customer_name}</span><span>₹${o.total}</span></div><p>${o.phone} • ${o.address}, ${o.pincode}</p><select onchange="updateStatus('${o.id}',this.value)">${["placed","confirmed","packed","shipped","out_for_delivery","delivered","cancelled"].map(s=>`<option ${s==o.status?"selected":""} value="${s}">${s.replaceAll("_"," ")}</option>`).join("")}</select></div>`).join("")}
async function updateStatus(id,status){let r=await sb.from("orders").update({status}).eq("id",id);if(r.error)alert(r.error.message)}
async function loadSettings(){let {data}=await sb.from("site_settings").select("*").eq("id",1).maybeSingle();if(data){slogo.value=data.logo||"";stitle.value=data.hero_title||"";stext.value=data.hero_text||"";sannouncement.value=data.announcement||"";saccent.value=data.accent||"#111111"}}
async function saveSettings(){let obj={id:1,logo:slogo.value,hero_title:stitle.value,hero_text:stext.value,announcement:sannouncement.value,accent:saccent.value};let r=await sb.from("site_settings").upsert(obj);if(r.error)alert(r.error.message);else alert("Settings saved")}
init();
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></body></html>
