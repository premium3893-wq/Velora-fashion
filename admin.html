<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VÉLORA Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f5;font-family:Arial}.top{background:#111;color:#fff;padding:16px 20px;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:13px;padding:16px;margin-bottom:15px}.tabs{display:flex;gap:8px;overflow:auto}.tabs button,.primary,.danger{border:0;padding:10px 14px;border-radius:8px;cursor:pointer}.tabs button{background:#ddd}.tabs .active,.primary{background:#111;color:#fff}.danger{background:#b42318;color:#fff}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}input,select,textarea{width:100%;padding:10px;margin:5px 0 10px;border:1px solid #ddd;border-radius:8px}.product{border:1px solid #eee;border-radius:10px;overflow:hidden}.product img{width:100%;height:210px;object-fit:cover}.p{padding:10px}.order{border:1px solid #eee;border-radius:10px;padding:12px;margin:9px 0}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body>
<div class=top><b>VÉLORA ADMIN</b><button class=primary onclick="location='index.html'">Store</button></div><div class=wrap><div id=login class=card><h2>Admin Login</h2><input id=email type=email placeholder=Email><input id=password type=password placeholder=Password><button class=primary onclick=login()>Login</button><p id=msg></p></div><div id=app class=hidden><div class=tabs><button class=active onclick="tab('dash',this)">Dashboard</button><button onclick="tab('prod',this)">Products</button><button onclick="tab('orders',this)">Orders</button><button onclick="tab('settings',this)">Website</button><button onclick=logout()>Logout</button></div>
<section id=dash class=card><h2>Dashboard</h2><div class=grid><div class=card><b id=pc>0</b><br>Products</div><div class=card><b id=oc>0</b><br>Orders</div><div class=card><b id=sales>₹0</b><br>Sales</div></div></section>
<section id=prod class="card hidden"><h2>Products</h2><button class=primary onclick=newP()>+ Add product</button><div id=form class="card hidden"><input id=pid type=hidden><input id=pn placeholder="Product name"><input id=pcat placeholder=Category><input id=pp type=number placeholder=Price><input id=pd type=number placeholder="Discount %"><input id=stock type=number placeholder=Stock><input id=sizes placeholder="Sizes: S,M,L,XL"><input id=colors placeholder="Colors: Black,White"><input id=file type=file accept=image/*><input id=image placeholder="Image URL fallback"><button class=primary onclick=saveP()>Save product</button></div><div id=plist class=grid></div></section>
<section id=orders class="card hidden"><h2>Orders</h2><div id=olist></div></section>
<section id=settings class="card hidden"><h2>Website settings</h2><input id=sl placeholder=Logo><input id=st placeholder="Hero title"><textarea id=sx placeholder="Hero text"></textarea><input id=sa placeholder=Announcement><input id=sc placeholder="Accent color"><button class=primary onclick=saveS()>Save</button></section></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL="https://ggvanfhwascvoptxmzle.supabase.co",KEY="sb_publishable_O3QmC27XiGOGuePSEaZD1A_x5BdIkqb",sb=supabase.createClient(URL,KEY),$=x=>document.getElementById(x);
function tab(id,b){document.querySelectorAll("#app>section").forEach(x=>x.classList.add("hidden"));$(id).classList.remove("hidden");document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active")}async function boot(){let r=await sb.auth.getSession();if(r.data.session)enter()}async function login(){let r=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(r.error)msg.textContent=r.error.message;else enter()}function enter(){login.classList.add("hidden");app.classList.remove("hidden");load()}async function logout(){await sb.auth.signOut();location.reload()}async function load(){let p=await sb.from("products").select("*").order("created_at",{ascending:false});if(p.error)return alert(p.error.message);pc.textContent=p.data.length;plist.innerHTML=p.data.map(x=>`<div class=product><img src="${x.image||""}"><div class=p><b>${x.name}</b><br>₹${x.price} • Stock ${x.stock||0}<br><button class=primary onclick='edit(${JSON.stringify(x)})'>Edit</button> <button class=danger onclick="del('${x.id}')">Delete</button></div></div>`).join("");let o=await sb.from("orders").select("*").order("created_at",{ascending:false});if(o.error)return alert(o.error.message);oc.textContent=o.data.length;sales.textContent="₹"+o.data.reduce((a,x)=>a+(+x.total||0),0);olist.innerHTML=o.data.map(x=>`<div class=order><b>${x.order_code}</b> — ${x.customer_name} — ₹${x.total}<br>${x.phone}<br>${x.address}<select onchange="status('${x.id}',this.value)">${["placed","confirmed","packed","shipped","out_for_delivery","delivered","cancelled"].map(s=>`<option value=${s} ${s==x.status?"selected":""}>${s.replaceAll("_"," ")}</option>`).join("")}</select></div>`).join("");let s=await sb.from("site_settings").select("*").eq("id",1).maybeSingle();if(s.data){sl.value=s.data.logo||"";st.value=s.data.hero_title||"";sx.value=s.data.hero_text||"";sa.value=s.data.announcement||"";sc.value=s.data.accent||"#111"}}
function newP(){form.classList.remove("hidden");[pid,pn,pcat,pp,pd,stock,sizes,colors,image].forEach(x=>x.value="");file.value=""}function edit(x){newP();pid.value=x.id;pn.value=x.name;pcat.value=x.category||"";pp.value=x.price;pd.value=x.discount||0;stock.value=x.stock||0;sizes.value=(x.sizes||[]).join(",");colors.value=(x.colors||[]).join(",");image.value=x.image||""}
async function saveP(){let img=image.value.trim(),f=file.files[0];if(f){let path=crypto.randomUUID()+"-"+f.name.replace(/[^a-zA-Z0-9._-]/g,"");let u=await sb.storage.from("product-images").upload(path,f,{upsert:true});if(u.error)return alert(u.error.message);img=sb.storage.from("product-images").getPublicUrl(path).data.publicUrl}let x={name:pn.value,category:pcat.value,price:+pp.value||0,discount:+pd.value||0,stock:+stock.value||0,sizes:sizes.value.split(",").map(x=>x.trim()).filter(Boolean),colors:colors.value.split(",").map(x=>x.trim()).filter(Boolean),image:img,active:true};let r=pid.value?await sb.from("products").update(x).eq("id",pid.value):await sb.from("products").insert(x);if(r.error)alert(r.error.message);else{form.classList.add("hidden");load()}}async function del(id){if(confirm("Delete product?")){let r=await sb.from("products").delete().eq("id",id);if(r.error)alert(r.error.message);else load()}}async function status(id,s){let r=await sb.from("orders").update({status:s}).eq("id",id);if(r.error)alert(r.error.message)}async function saveS(){let r=await sb.from("site_settings").upsert({id:1,logo:sl.value,hero_title:st.value,hero_text:sx.value,announcement:sa.value,accent:sc.value});if(r.error)alert(r.error.message);else alert("Saved")}boot();
</script></body></html>
