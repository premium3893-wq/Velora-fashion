<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VÉLORA Fashion</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f8f7f4;color:#111}.bar{background:#111;color:#fff;text-align:center;padding:8px;font-size:12px}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;z-index:5}.nav{max-width:1150px;margin:auto;padding:15px;display:flex;gap:12px;align-items:center}.logo{font-size:23px;font-weight:900;letter-spacing:3px;margin-right:auto}.search{width:330px;max-width:45vw;padding:11px 16px;border:1px solid #ddd;border-radius:30px}.btn{border:0;background:#111;color:#fff;padding:11px 15px;border-radius:9px;cursor:pointer}.hero{max-width:1150px;margin:20px auto;padding:55px 25px;border-radius:22px;background:linear-gradient(120deg,#eee9e2,#d5d0c8);min-height:300px}.hero h1{font-size:clamp(40px,7vw,75px);margin:8px 0}.wrap{max-width:1150px;margin:auto;padding:10px 15px 50px}.cats{display:flex;gap:8px;overflow:auto;padding:10px 0 20px}.cat{padding:9px 15px;border:1px solid #ddd;background:#fff;border-radius:20px;white-space:nowrap}.active{background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid #eee;border-radius:14px;overflow:hidden}.pic{aspect-ratio:3/4;background:#eee}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:12px}.add{width:100%;margin-top:9px;padding:11px;border:0;border-radius:8px;background:#111;color:#fff}.muted{color:#777;font-size:13px}.drawer{position:fixed;right:-430px;top:0;width:min(430px,100%);height:100%;background:#fff;z-index:20;padding:20px;overflow:auto;transition:.2s;box-shadow:-10px 0 30px #0002}.open{right:0}.overlay{display:none;position:fixed;inset:0;background:#0006;z-index:15}.show{display:block}.item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.item img{width:60px;height:78px;object-fit:cover}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:30;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:#fff;border-radius:15px;padding:20px;width:min(520px,100%)}input,textarea,select{width:100%;padding:11px;margin:6px 0 10px;border:1px solid #ddd;border-radius:8px}.close{float:right;border:0;background:none;font-size:25px}.track{border:1px solid #eee;border-radius:10px;padding:12px;margin-top:12px}.steps{display:flex;gap:3px}.step{flex:1;text-align:center;font-size:9px}.dot{width:20px;height:20px;border-radius:50%;background:#ddd;margin:auto}.done .dot{background:#111}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.search{display:none}}
</style></head><body>
<div class="bar" id="announce">Free shipping on selected orders</div><header><div class="nav"><div class="logo" id="logo">VÉLORA</div><input id="search" class="search" placeholder="Search fashion..."><button class="btn" id="cartBtn">🛒 Cart <span id="count">0</span></button></div></header>
<section class="hero"><div><small>NEW SEASON</small><h1 id="heroTitle">Everyday, elevated.</h1><p id="heroText">Curated fashion essentials for everyday style.</p><button class="btn" onclick="document.querySelector('.wrap').scrollIntoView({behavior:'smooth'})">Shop collection</button></div></section>
<div class="wrap"><div id="cats" class="cats"></div><div id="products" class="grid"></div></div>
<div id="overlay" class="overlay"></div><aside id="drawer" class="drawer"><button class="close" id="closeCart">×</button><h2>Your Cart</h2><div id="cartList"></div><h3 id="total">Total: ₹0</h3><button class="btn" style="width:100%" id="checkout">Checkout</button><hr><h3>Track Order</h3><input id="trackId" placeholder="Order ID"><button class="btn" style="width:100%" id="track">Track</button><div id="trackResult"></div></aside>
<div id="modal" class="modal"><div class="box"><button class="close" id="closeModal">×</button><h2>Checkout</h2><input id="name" placeholder="Full name"><input id="phone" placeholder="Phone"><textarea id="address" rows="3" placeholder="Full address"></textarea><input id="pin" placeholder="PIN code"><select id="payment"><option value="cod">Cash on Delivery</option><option value="online">Online payment</option></select><button class="btn" style="width:100%" id="place">Place order</button><div id="msg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL="https://ggvanfhwascvoptxmzle.supabase.co",KEY="sb_publishable_O3QmC27XiGOGuePSEaZD1A_x5BdIkqb",sb=supabase.createClient(URL,KEY);let P=[],C=JSON.parse(localStorage.vc||"[]"),cat="All";const $=x=>document.getElementById(x);
const demo=[["Oversized Tee","Men",799,"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=700&q=80"],["Linen Shirt","Men",1299,"https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=700&q=80"],["Summer Dress","Women",1599,"https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=700&q=80"],["Handbag","Accessories",999,"https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=700&q=80"],["Street Hoodie","Men",1499,"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=700&q=80"],["Co-ord Set","Women",1399,"https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=700&q=80"],["Classic Cap","Accessories",499,"https://images.unsplash.com/photo-1521369909029-2afed882baee?auto=format&fit=crop&w=700&q=80"],["Sneakers","Footwear",1899,"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80"]].map((x,i)=>({id:"d"+i,name:x[0],category:x[1],price:x[2],image:x[3]}));
async function init(){try{let r=await sb.from("products").select("*").eq("active",true).order("created_at",{ascending:false});P=r.data?.length?r.data:demo}catch(e){P=demo}let s=await sb.from("site_settings").select("*").eq("id",1).maybeSingle();if(s.data){logo.textContent=s.data.logo||"VÉLORA";heroTitle.textContent=s.data.hero_title||"Everyday, elevated.";heroText.textContent=s.data.hero_text||"";announce.textContent=s.data.announcement||""}renderCats();render();cart()}
function renderCats(){let a=["All",...new Set(P.map(x=>x.category).filter(Boolean))];cats.innerHTML=a.map(x=>`<button class="cat ${x==cat?"active":""}" onclick="cat='${x}';renderCats();render()">${x}</button>`).join("")}
function render(){let q=search.value.toLowerCase(),a=P.filter(x=>(cat=="All"||x.category==cat)&&x.name.toLowerCase().includes(q));products.innerHTML=a.map(x=>`<article class="card"><div class="pic"><img src="${x.image||""}"></div><div class="info"><b>${x.name}</b><div class="muted">${x.category||""}</div><strong>₹${x.discount?Math.round(x.price*(1-x.discount/100)):x.price}</strong><button class="add" onclick="add('${x.id}')">Add to cart</button></div></article>`).join("")||"<p>No products found.</p>"}
function save(){localStorage.vc=JSON.stringify(C);cart()}function add(id){let p=P.find(x=>x.id==id),x=C.find(x=>x.id==id);x?x.qty++:C.push({id:p.id,name:p.name,price:Math.round(p.discount?p.price*(1-p.discount/100):p.price),image:p.image,qty:1});save();openCart()}function cart(){count.textContent=C.reduce((a,x)=>a+x.qty,0);cartList.innerHTML=C.map(x=>`<div class="item"><img src="${x.image}"><div style="flex:1"><b>${x.name}</b><br>₹${x.price}<br><button onclick="chg('${x.id}',-1)">−</button> ${x.qty} <button onclick="chg('${x.id}',1)">+</button></div></div>`).join("")||"<p>Cart is empty.</p>";total.textContent="Total: ₹"+C.reduce((a,x)=>a+x.price*x.qty,0)}function chg(id,n){let x=C.find(x=>x.id==id);x.qty+=n;if(x.qty<1)C=C.filter(x=>x.id!=id);save()}function openCart(){drawer.classList.add("open");overlay.classList.add("show")}function closeCart(){drawer.classList.remove("open");overlay.classList.remove("show")}
cartBtn.onclick=openCart;closeCart.onclick=closeCart;overlay.onclick=closeCart;search.oninput=render;checkout.onclick=()=>{if(!C.length)return alert("Cart is empty");modal.classList.add("show")};closeModal.onclick=()=>modal.classList.remove("show");
place.onclick=async()=>{if(!name.value||!phone.value||!address.value||!pin.value)return alert("Fill all details");let code="VLR-"+Date.now().toString().slice(-8),t=C.reduce((a,x)=>a+x.price*x.qty,0);let r=await sb.from("orders").insert({order_code:code,customer_name:name.value,phone:phone.value,address:address.value,pincode:pin.value,payment_method:payment.value,total:t,items:C,status:"placed"});if(r.error)return alert(r.error.message);localStorage.last=JSON.stringify({id:code,total:t,status:"placed"});C=[];save();msg.innerHTML=`<div class="track">Order placed!<br>Order ID: <b>${code}</b></div>`};
track.onclick=async()=>{let id=trackId.value.trim(),r=await sb.from("orders").select("order_code,status,total").eq("order_code",id).maybeSingle(),o=r.data;if(!o){let x=JSON.parse(localStorage.last||"null");if(x?.id==id)o={order_code:x.id,status:x.status,total:x.total}}if(!o)return trackResult.innerHTML="<div class=track>Order not found.</div>";let s=["placed","confirmed","packed","shipped","out_for_delivery","delivered"],l=["Placed","Confirmed","Packed","Shipped","Out for delivery","Delivered"],i=s.indexOf(o.status);trackResult.innerHTML=`<div class=track><b>${o.order_code}</b><div class=steps>${l.map((x,k)=>`<div class="step ${k<=i?"done":""}"><div class=dot></div>${x}</div>`).join("")}</div>Total: ₹${o.total}</div>`};init();
</script></body></html>
