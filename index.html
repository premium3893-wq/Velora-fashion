<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Budgetbrand_gkp — Fashion Store</title>

<style>
:root{
  --accent:#111;
  --bg:#faf9f7;
  --card:#fff;
  --muted:#777;
  --border:#e9e6e1;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:#111;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

/* TOP */
.top{
  background:#111;
  color:#fff;
  text-align:center;
  padding:8px;
  font-size:12px;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #eee;
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  align-items:center;
  gap:20px;
}

.logo{
  font-size:24px;
  font-weight:800;
  letter-spacing:3px;
  margin-right:auto;
  white-space:nowrap;
}

/* SEARCH */
.searchWrap{
  position:relative;
  width:min(430px,42vw);
}

.search{
  width:100%;
  height:48px;
  border:1px solid #e3e0db;
  border-radius:17px;
  padding:0 48px 0 45px;
  outline:none;
  background:linear-gradient(135deg,#fff,#faf9f6);
  box-shadow:0 5px 20px #1111110a;
  transition:.25s;
  font-size:14px;
}

.search:hover{
  border-color:#ccc6bd;
  box-shadow:0 8px 26px #11111112;
}

.search:focus{
  border-color:#111;
  box-shadow:
    0 0 0 4px #1111110a,
    0 10px 30px #11111114;
}

.searchIcon{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-52%);
  font-size:23px;
  color:#555;
  pointer-events:none;
  z-index:2;
}

.clearSearch{
  position:absolute;
  right:9px;
  top:9px;
  width:30px;
  height:30px;
  border:0;
  border-radius:50%;
  background:#eee;
  color:#555;
  font-size:19px;
  display:none;
  align-items:center;
  justify-content:center;
}

.clearSearch:hover{
  background:#111;
  color:#fff;
}

.searchMeta{
  position:absolute;
  top:56px;
  left:5px;
  right:5px;
  background:#fff;
  border:1px solid #eee;
  border-radius:13px;
  padding:11px 13px;
  font-size:12px;
  color:#777;
  box-shadow:0 15px 35px #1112;
  display:none;
  z-index:50;
}

.searchWrap.active .searchMeta{
  display:block;
}

/* BUTTON */
.cart{
  border:0;
  background:#111;
  color:#fff;
  border-radius:25px;
  padding:11px 17px;
  transition:.2s;
  white-space:nowrap;
}

.cart:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 20px #1113;
}

/* HERO */
.hero{
  max-width:1200px;
  margin:20px auto;
  padding:70px 30px;
  border-radius:24px;
  background:linear-gradient(120deg,#eee,#d8d2ca);
  display:flex;
  align-items:center;
  min-height:320px;
}

.hero h1{
  font-size:clamp(38px,6vw,72px);
  margin:0 0 12px;
  line-height:1;
}

.hero p{
  color:#555;
  max-width:520px;
  line-height:1.6;
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:25px 20px;
}

/* CATEGORIES */
.cats{
  display:flex;
  gap:10px;
  overflow:auto;
  padding-bottom:18px;
  scrollbar-width:none;
}

.cats::-webkit-scrollbar{display:none}

.cat{
  white-space:nowrap;
  border:1px solid #ddd;
  background:#fff;
  border-radius:22px;
  padding:10px 16px;
  transition:.2s;
}

.cat:hover{
  transform:translateY(-1px);
}

.cat.active{
  background:#111;
  color:#fff;
  border-color:#111;
}

/* PRODUCTS */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.product{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  border:1px solid #eee;
  transition:.25s;
}

.product:hover{
  transform:translateY(-4px);
  box-shadow:0 14px 35px #11111112;
}

.pic{
  aspect-ratio:3/4;
  background:#eee;
  overflow:hidden;
  cursor:pointer;
  position:relative;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.4s;
}

.product:hover .pic img{
  transform:scale(1.04);
}

.photoBadge{
  position:absolute;
  bottom:10px;
  right:10px;
  background:#fff;
  padding:6px 9px;
  border-radius:20px;
  font-size:11px;
  box-shadow:0 4px 15px #0002;
}

.info{
  padding:14px;
}

.name{
  font-weight:700;
}

.muted{
  color:var(--muted);
  font-size:13px;
  margin:5px 0;
}

.price{
  font-weight:800;
}

.add,
.viewGallery{
  width:100%;
  margin-top:10px;
  padding:11px;
  border-radius:10px;
  cursor:pointer;
}

.add{
  border:0;
  background:#111;
  color:#fff;
}

.viewGallery{
  border:1px solid #ddd;
  background:#fff;
}

.viewGallery:hover{
  background:#111;
  color:#fff;
}

.empty{
  text-align:center;
  padding:60px;
  color:#777;
  grid-column:1/-1;
}

/* GALLERY */
.galleryModal{
  position:fixed;
  inset:0;
  background:#000b;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.galleryModal.show{
  display:flex;
}

.galleryBox{
  width:min(900px,100%);
  max-height:94vh;
  overflow:auto;
  background:#fff;
  border-radius:22px;
  padding:18px;
  position:relative;
}

.galleryClose{
  position:absolute;
  right:15px;
  top:15px;
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#fff;
  font-size:25px;
  z-index:5;
  box-shadow:0 5px 20px #0003;
}

.galleryMain{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:#f3f2ef;
  border-radius:17px;
  overflow:hidden;
}

.galleryMain img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.galleryArrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:#fff;
  box-shadow:0 5px 20px #0003;
  font-size:28px;
  z-index:3;
}

.galleryArrow.prev{left:14px}
.galleryArrow.next{right:14px}

.galleryInfo{
  padding:15px 3px 5px;
}

.galleryInfo h3{
  margin:0;
}

.galleryCounter{
  color:#777;
  font-size:13px;
  margin-top:4px;
}

.galleryDots{
  display:flex;
  justify-content:center;
  gap:7px;
  margin:10px 0;
}

.galleryDot{
  width:8px;
  height:8px;
  padding:0;
  border:0;
  border-radius:50%;
  background:#ccc;
}

.galleryDot.active{
  background:#111;
}

.galleryThumbs{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:5px 0;
}

.galleryThumb{
  flex:0 0 65px;
  height:78px;
  padding:2px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:9px;
  overflow:hidden;
}

.galleryThumb.active{
  border:2px solid #111;
}

.galleryThumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:6px;
}

/* CART */
.drawer{
  position:fixed;
  right:-430px;
  top:0;
  width:min(430px,100%);
  height:100%;
  background:#fff;
  z-index:70;
  box-shadow:-10px 0 30px #0002;
  transition:.25s;
  padding:20px;
  overflow:auto;
}

.drawer.open{
  right:0;
}

.overlay{
  position:fixed;
  inset:0;
  background:#0005;
  z-index:60;
  display:none;
}

.overlay.show{
  display:block;
}

.cartitem{
  display:flex;
  gap:12px;
  border-bottom:1px solid #eee;
  padding:14px 0;
}

.cartitem img{
  width:65px;
  height:85px;
  object-fit:cover;
  border-radius:8px;
}

.qty button{
  border:1px solid #ddd;
  background:#fff;
  width:28px;
  height:28px;
  border-radius:50%;
}

.checkout{
  width:100%;
  padding:13px;
  background:#111;
  color:#fff;
  border:0;
  border-radius:10px;
  margin-top:15px;
}

.close{
  float:right;
  border:0;
  background:none;
  font-size:24px;
}

/* CHECKOUT */
.modal{
  position:fixed;
  inset:0;
  background:#0006;
  z-index:90;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.box{
  background:#fff;
  border-radius:18px;
  width:min(520px,100%);
  padding:22px;
  max-height:90vh;
  overflow:auto;
}

.box input,
.box textarea,
.box select{
  width:100%;
  padding:11px;
  margin:7px 0 12px;
  border:1px solid #ddd;
  border-radius:9px;
  outline:none;
}

/* TRACKING */
.status{
  display:flex;
  justify-content:space-between;
  margin:18px 0;
  font-size:12px;
  gap:4px;
}

.step{
  flex:1;
  text-align:center;
}

.dot{
  width:24px;
  height:24px;
  border-radius:50%;
  background:#ddd;
  margin:auto auto 5px;
}

.step.done .dot{
  background:#111;
}

.track{
  margin-top:20px;
  border:1px solid #eee;
  border-radius:12px;
  padding:15px;
}

/* RESPONSIVE */
@media(max-width:850px){

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .searchWrap{
    width:45vw;
  }

  .hero{
    margin:12px;
  }

  .nav{
    padding:14px 12px;
    gap:10px;
  }

}

@media(max-width:600px){

  .logo{
    font-size:18px;
  }

  .cart{
    padding:10px 13px;
    font-size:13px;
  }

  .searchWrap{
    position:absolute;
    left:12px;
    right:12px;
    top:62px;
    width:auto;
  }

  .nav{
    padding-bottom:64px;
  }

  .hero{
    margin-top:62px;
    min-height:280px;
    padding:45px 22px;
  }

}

@media(max-width:480px){

  .grid{
    gap:10px;
  }

  .info{
    padding:10px;
  }

  .hero h1{
    font-size:42px;
  }

  .galleryBox{
    padding:10px;
    border-radius:17px;
  }

  .galleryMain{
    aspect-ratio:4/5;
  }

}
</style>
</head>

<div class="top" id="announcement">
  Free shipping on selected orders • New collection live
</div>

<header>
  <div class="nav">

    <div class="logo" id="logo">
      VÉLORA
    </div>

    <div class="searchWrap">

      <span class="searchIcon">⌕</span>

      <input
        id="search"
        class="search"
        autocomplete="off"
        placeholder="Search products, categories..."
      >

      <button
        class="clearSearch"
        id="clearSearch"
      >×</button>

      <div
        class="searchMeta"
        id="searchMeta"
      ></div>

    </div>

    <button class="cart" onclick="openCart()">
      🛒 Cart <span id="count">0</span>
    </button>

  </div>
</header>

<main>

<section class="hero">

  <div>

    <div class="muted">
      NEW SEASON
    </div>

    <h1 id="heroTitle">
      Everyday, elevated.
    </h1>

    <p id="heroText">
      Curated fashion essentials designed for your everyday style.
    </p>

    <button
      class="cart"
      onclick="document.getElementById('products').scrollIntoView()"
    >
      Shop collection
    </button>

  </div>

</section>

<div class="wrap">

  <div
    class="cats"
    id="cats"
  ></div>

  <div
    class="grid"
    id="products"
  ></div>

</div>

</main>

<!-- PRODUCT GALLERY -->

<div
  class="galleryModal"
  id="galleryModal"
  onclick="galleryBackground(event)"
>

  <div class="galleryBox">

    <button
      class="galleryClose"
      onclick="closeGallery()"
    >
      ×
    </button>

    <div class="galleryMain">

      <button
        class="galleryArrow prev"
        onclick="galleryPrev()"
      >
        ‹
      </button>

      <img
        id="galleryImage"
        src=""
        alt="Product"
      >

      <button
        class="galleryArrow next"
        onclick="galleryNext()"
      >
        ›
      </button>

    </div>

    <div class="galleryInfo">

      <h3 id="galleryName"></h3>

      <div
        class="galleryCounter"
        id="galleryCounter"
      ></div>

    </div>

    <div
      class="galleryDots"
      id="galleryDots"
    ></div>

    <div
      class="galleryThumbs"
      id="galleryThumbs"
    ></div>

  </div>

</div>

<!-- CART -->

<div
  class="overlay"
  id="overlay"
  onclick="closeCart()"
></div>

<aside
  class="drawer"
  id="drawer"
>

  <button
    class="close"
    onclick="closeCart()"
  >×</button>

  <h2>Your Cart</h2>

  <div id="cartList"></div>

  <h3 id="total">
    Total: ₹0
  </h3>

  <button
    class="checkout"
    onclick="checkout()"
  >
    Proceed to checkout
  </button>

  <hr>

  <h3>Track an order</h3>

  <input
    id="trackId"
    placeholder="Order ID"
  >

  <button
    class="checkout"
    onclick="trackOrder()"
  >
    Track order
  </button>

  <div id="trackResult"></div>

</aside>

<!-- CHECKOUT -->

<div
  class="modal"
  id="modal"
>

  <div class="box">

    <button
      class="close"
      onclick="closeModal()"
    >×</button>

    <h2>Checkout</h2>

    <input
      id="name"
      placeholder="Full name"
    >

    <input
      id="phone"
      placeholder="Phone number"
    >

    <textarea
      id="address"
      rows="3"
      placeholder="Full delivery address"
    ></textarea>

    <input
      id="pincode"
      placeholder="PIN code"
    >

    <select id="payment">

      <option value="cod">
        Cash on Delivery
      </option>

      <option value="online">
        Online payment (connect gateway)
      </option>

    </select>

    <button
      class="checkout"
      onclick="placeOrder()"
    >
      Place order
    </button>

    <div id="orderMsg"></div>

  </div>

</div>

throw 0;
}

const sb=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

const {data}=await sb
.from("products")
.select("*")
.eq("active",true)
.order("created_at",{ascending:false});

products=data?.length?data:demo;

}catch(e){

products=demo;

}

renderCats();
renderProducts();
renderCart();

}

p.images.length
){
return p.images;
}

return p.image?[p.image]:[];

}
